name: Fork Sync Upstream

# Fork-only workflow: merges stablyai/orca main into this fork's main every
# 15 minutes when it moved. The resulting push to main triggers the release
# build (fork-mac-arm64-release.yml runs on push). A merge conflict stops the
# run silently — the next scheduled run retries.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Why: the default GITHUB_TOKEN cannot push changes to workflow files
          # (.github/workflows/*), which upstream edits regularly. A PAT with
          # the `workflow` scope can.
          token: ${{ secrets.SYNC_PAT }}

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream main
          behind="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$behind"
          if [[ "$behind" == "0" ]]; then
            echo "main is up to date; skipping."
            exit 0
          fi
          if ! git merge upstream/main --no-edit; then
            git merge --abort || true
            echo "::warning::Merge conflict with upstream main; skipping this run."
            exit 0
          fi
          git push origin main
