name: Fork macOS arm64 Release

# Fork-only workflow: builds an UNSIGNED macOS arm64 app from this branch and
# publishes it as a GitHub release on the fork. No upstream secrets required.
# The app is ad-hoc signed at best; after downloading, clear quarantine once:
#   xattr -dr com.apple.quarantine /Applications/Orca.app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: code-server-tab-b<run number>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: fork-mac-arm64-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors build:mac but invokes electron-builder with --publish never:
      # the config's publish section otherwise makes CI builds try to publish
      # to the upstream feed, which this fork has no token (or wish) for.
      - name: Build macOS app (unsigned, host arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          pnpm run build:desktop
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:notification-status-macos
          pnpm run ensure:electron-runtime
          export ORCA_BUILD_COMMIT="$(git rev-parse --short=12 HEAD)"
          export ORCA_LOCAL_BUILD_VERSION="$(node -e 'const p=require("./package.json");const c=process.env.ORCA_BUILD_COMMIT;const s=`local.${Date.now()}.${c}`;console.log(p.version.includes("-")?`${p.version}.${s}`:`${p.version}-${s}`)')"
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never

      - name: List build output
        run: ls -lh dist/ || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag="code-server-tab-b${{ github.run_number }}"
          fi
          notes="Unsigned macOS arm64 build of the code-server-tab branch (chromeless code-server tab, Mod+Shift+C).

          After installing, clear Gatekeeper quarantine once:
          \`xattr -dr com.apple.quarantine /Applications/Orca.app\`

          If macOS still refuses to launch it, re-sign ad hoc:
          \`codesign --force --deep -s - /Applications/Orca.app\`

          Built from ${{ github.sha }}."
          assets=()
          while IFS= read -r f; do assets+=("$f"); done < <(find dist -maxdepth 1 \( -name '*arm64*.dmg' -o -name '*arm64*.zip' \) -type f)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No dmg/zip artifacts found in dist/' >&2
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "code-server tab — mac arm64 ($tag)" \
            --notes "$notes" \
            --prerelease
